```yaml
name: Build

on:
  push:
    branches: ['**']
    tags: ['v*']
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        python: ['3.10']

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}

      - name: Install dependencies
        run: npm ci

      - name: Fix Node.js type compatibility
        run: npm install --no-save --package-lock=false @types/node@20

      - name: Run tests
        run: npm test

      - name: Upload Artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: build-artifacts
          path: ./dist
          if-no-files-found: warn

  publish:
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download Artifact
        uses: actions/download-artifact@v4
        with:
          name: build-artifacts
